name: CodSpeed

on:
  workflow_call:
    inputs:
      mode:
        type: string
        default: simulation
      baseline-ref:
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      mode:
        description: CodSpeed instrument
        type: choice
        options:
          - simulation
          - walltime
          - simulation,walltime
        default: simulation
      baseline-ref:
        description: Optional baseline revision to measure on the same runner
        type: string
        default: ''
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  benchmark:
    name: Benchmark
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Setup toolchains
        uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3.6.3
      - name: Setup Aikido Safe Chain
        env:
          SAFE_CHAIN_RELEASE: '1.5.25'
        run: |
          curl --proto '=https' --proto-redir '=https' -fsSL \
            "https://github.com/AikidoSec/safe-chain/releases/download/${SAFE_CHAIN_RELEASE}/install-safe-chain.sh" \
            -o "$RUNNER_TEMP/install-safe-chain.sh"
          echo "83069f6db4215cccf6a26bdd6e65a5c2366b9d24322b2d5d2862d47385e56682  $RUNNER_TEMP/install-safe-chain.sh" | sha256sum --check
          sh "$RUNNER_TEMP/install-safe-chain.sh" --ci
      - name: Install dependencies
        run: bun ci
      - name: Check out comparison baseline
        if: inputs.baseline-ref != ''
        id: comparison
        env:
          BASELINE_REF: ${{ inputs.baseline-ref }}
        run: |
          candidate_sha=$(git rev-parse HEAD)
          git fetch --no-tags --depth=1 -- origin "$BASELINE_REF"
          baseline_sha=$(git rev-parse 'FETCH_HEAD^{commit}')
          if ! git diff --quiet "$baseline_sha" "$candidate_sha" -- \
            package.json bun.lock bunfig.toml mise.toml tsconfig.json \
            vitest.config.mts benchmarks/ ':!benchmarks/README.md'; then
            echo 'Comparison requires identical dependencies, toolchains, and benchmark workloads.' >&2
            exit 1
          fi
          echo "candidate-sha=$candidate_sha" >> "$GITHUB_OUTPUT"
          git checkout --detach "$baseline_sha"
      - name: Measure comparison baseline
        if: inputs.baseline-ref != ''
        uses: CodSpeedHQ/action@f842b9a3ffe213dbb81768fd7f7eeb4dfcf1c369 # v5.4.2
        with:
          runner-version: '5.4.0'
          cycle-estimation: 'true'
          exclude-allocations: 'false'
          run: bun run bench
          mode: ${{ inputs.mode || 'simulation' }}
      - name: Restore candidate revision
        if: inputs.baseline-ref != ''
        env:
          CANDIDATE_SHA: ${{ steps.comparison.outputs.candidate-sha }}
        run: git checkout --detach "$CANDIDATE_SHA"
      - name: Run benchmarks
        uses: CodSpeedHQ/action@f842b9a3ffe213dbb81768fd7f7eeb4dfcf1c369 # v5.4.2
        with:
          runner-version: '5.4.0'
          cycle-estimation: 'true'
          exclude-allocations: 'false'
          run: bun run bench
          mode: ${{ inputs.mode || 'simulation' }}
