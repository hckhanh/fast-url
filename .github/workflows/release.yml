name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  npm:
    name: NPM
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Setup toolchains
        uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3.6.3
      - name: Setup Aikido Safe Chain
        uses: ./.github/actions/setup-safe-chain
      - name: Install Dependencies
        run: bun ci
      - name: Update npm
        run: npm install -g npm@12.1.0 --ignore-scripts
      - name: Create Release Pull Request or Publish to npm
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        id: changesets
        with:
          publish: bun release
          commitMode: 'github-api'
          title: 'Release new version'
          commit: 'chore(release): bump version package'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SAFE_CHAIN_MINIMUM_PACKAGE_AGE_HOURS: 0
      - name: Publish to JSR
        run: |
          bun tools/jsr.ts
          bunx jsr@0.14.3 publish --allow-dirty
        if: steps.changesets.outputs.published == 'true'
